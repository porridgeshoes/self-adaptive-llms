defaults:
  - _self_
  - policy@_global_: default
  - task@_global_: gsm8k
  - base_model@_global_: llama3i8b
  - optimization@_global_: reinforce
  - mode@_global_: training

num_iters: 2000
test_interval: 10
lr: 2e-3
batch_size: 256
seed: 42
init_val: 0.1
test_only: false
model_dir: null
save_legacy_params: false
use_lora: false
prompt_based_eval: false
experts_path_dict: null

run_name: null

load_ckpt: null
exp_suffix: 'st'

exp_name: ${base_model_name}/${optim_name}-${exp_suffix}

# wandb_log: true # enabled by default
wandb_log: false
wandb_project: shakeoff
wandb_group_name: ${exp_name}
extract_svd: false

out_dir: results

hydra:
  run:
    dir: ${out_dir}/

# 配置HF的全局缓存路径，即，未联网状态下从哪读取数据集。
hf_home: /data1/yammyjiang/new_space/light_things/LLM/self-adaptive-llms/download

# 配置分解后的svd参数在哪个文件夹下保存。默认是运行目录，导致老被删。
param_folder_path: /data1/yammyjiang/new_space/heavy_things/self-adaptive-llms/svd_params